
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing
spec:
  replicas: 3

  selector:
    matchLabels:
      app: data-processing

  template:
    metadata:
      labels:
        app: data-processing

    spec:
      containers:
        - name: data-processing
          image: data-processing:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: data-processing-config

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
